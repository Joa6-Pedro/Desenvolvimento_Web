<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Lojinha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
    </nav>
    <div class="form-container">
        <form class="signForm">
            <div class="form-container-text">
                <h1>Novo por aqui?</h1>
                <p>Cadastre-se!</p>
            </div>

            <label for="cpf">CPF</label>
            <input type="text" name="cpf" placeholder="CPF">

            <label for="email">Email</label>
            <input type="email" name="email" placeholder="Email">

            <label for="password" >Senha</label>
            <input type="password" name="password" placeholder="Senha">
            <label for="confirmPassword">Confirmar Senha</label>
            <input type="password" name="confirmPassword" placeholder="Confirmar Senha">
        
            <button class="formBtn" onclick="signUp()">Criar Conta</button>
        </form>
        <p>Já tem uma conta?</p>
        <a href="signIn.html">Entrar</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
