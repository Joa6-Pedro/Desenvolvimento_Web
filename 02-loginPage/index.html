<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="container">
        <div class="formContainer signUp">
            <form>
                <h1>Criar Conta</h1>
                <div class="socialIcons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook"></i></a>
                </div>
                <span>Ou use seu Email para registro</span>
                <label for="nome">Nome</label>
                <input type="text" name="nome" placeholder="Nome">

                <label for="email">Email</label>
                <input type="email" name="email" placeholder="Email">

                <label for="senha">Senha</label>
                <input type="password" name="senha" placeholder="Senha">

                <label for="confirmeSenha">Confirmar Senha</label>
                <input type="password" name="confirmeSenha" placeholder="Senha">

                <button>Registrar-se</button>
            </form>
        </div>

        <div class="formContainer signUp">
            <form>
                <h1>Entrar</h1>
                <div class="socialIcons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook"></i></a>
                </div>
                <span>Ou entre usando seu Email e senha</span>

                <label for="email">Email</label>
                <input type="email" name="email" placeholder="Email">

                <label for="senha">Senha</label>
                <input type="password" name="senha" placeholder="Senha">

                <a href="#">Esqueceu a senha?</a>
                <button>Entrar</button>
            </form>
        </div>
        <div class="toggleContainer">
            <div class="toggle">
                <div class="togglePanel toggleLeft">
                    <h1>Novo por aqui?</h1>
                    <p>Registre-se para ter acesso a todo o conteúdo do site</p>
                    <button class="hidden" id="criarConta">Criar Conta</button>
                </div>
                <div class="togglePanel toggleRight">
                    <h1>Já possui conta?</h1>
                    <p>Entre para ter acesso a todo o conteúdo do site</p>
                    <button class="hidden" id="Entrar">entrar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
