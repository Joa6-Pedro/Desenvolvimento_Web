<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="/css/style.css">
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>

  <main class="container">

    <div class="imgContainer">
      <img src="assets/images/illustration-article.svg" alt="illustration-article">
    </div>

    <div class="textContainer">
      <span id="tag">Learning</span>
      <p id="date">Published 21 Dec 2023</p>
      <h1 id="title">HTML & CSS foundations</h1>
      <p id="text">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>
    </div>

    <div class="authorContainer">
      <img src="assets/images/image-avatar.webp" alt="Author Picture">
      <span>Greg Hooper</span>
    </div>

  </main>

  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Joa6-Pedro</a>.</p>
  </footer>
</body>
</html>
